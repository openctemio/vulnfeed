name: Publish bundle

# Hourly: build the next vulnerability bundle from the previous release and
# what the sources changed since, sign it, verify it and publish it as a
# GitHub Release. Every release carries the full snapshot (a platform that
# fell behind takes it) and the delta from the previous release (a platform
# that applied the previous one takes only that). The hourly runs skip the
# test suite, which runs on every push and in the daily run.
#
# Two jobs on purpose. "build" talks to the sources and never sees the
# signing key. "publish" runs in the protected "publish" environment (only
# the default branch can deploy to it), holds the signing key and nothing
# else, and only signs, verifies and uploads what "build" produced.

on:
  schedule:
    - cron: "17 2 * * *" # daily: tests too
    - cron: "17 0,1,3-23 * * *" # hourly
  workflow_dispatch:
    inputs:
      allow_mass_change:
        description: "Publish even though the removal guard refused (only after checking the source)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  # Until the key ceremony in keys/README.md is done there is nothing to sign
  # with: say so once and skip the multi-hour source build, instead of failing
  # at the signing step every day.
  keys:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.keys.outputs.ready }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Key ceremony done?
        id: keys
        run: |
          if [ -s keys/root-keyid.txt ] && [ -s keys/keyset.dsse.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            msg="No keys yet (keys/root-keyid.txt, keys/keyset.dsse.json): nothing is built or published until the key ceremony in keys/README.md is done"
            echo "::warning::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: keys
    if: needs.keys.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        if: github.event_name != 'schedule' || github.event.schedule == '17 2 * * *'
        run: go test ./...
      - name: Build the CLI
        run: go build -trimpath -ldflags "-X main.version=${GITHUB_SHA::12}" -o vulnfeed ./cmd/vulnfeed
      - name: Download the previous release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p prev
          if gh release view --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release download --repo "$GITHUB_REPOSITORY" --dir prev --pattern 'snapshot*' --pattern 'latest.dsse.json' --pattern 'keyset.dsse.json'
            echo "PREV=--prev=prev" >> "$GITHUB_ENV"
          fi
      - name: Build the bundle
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          # Read-only token of this run: a higher GitHub API rate limit for
          # the CVE List. It reads public data only.
          GITHUB_TOKEN: ${{ github.token }}
          MASS: ${{ inputs.allow_mass_change && '--allow-mass-change' || '' }}
        run: ./vulnfeed build --out out --root-key-id "$(cat keys/root-keyid.txt)" $PREV $MASS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bundle
          path: out/
          retention-days: 3
          if-no-files-found: error

  publish:
    needs: [keys, build]
    if: needs.keys.outputs.ready == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build the CLI
        run: go build -trimpath -o vulnfeed ./cmd/vulnfeed
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bundle
          path: out
      - name: Sign
        env:
          VULNFEED_SIGNING_KEY: ${{ secrets.VULNFEED_SIGNING_KEY }}
        run: ./vulnfeed sign --dir out --keyset keys/keyset.dsse.json --root-key-id "$(cat keys/root-keyid.txt)"
      - name: Verify as the platform does
        run: ./vulnfeed verify --dir out --root-key-id "$(cat keys/root-keyid.txt)"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$(python3 -c 'import json,base64,sys; e=json.load(open("out/latest.dsse.json")); print(json.loads(base64.b64decode(e["payload"]))["tag"])')"
          cat > notes.md <<'EOF'
          Vulnerability bundle for OpenCTEM (RFC-066 §5.5), published hourly: a signed snapshot and the delta from the previous release.

          This product uses data from the NVD API but is not endorsed or certified by the NVD.
          CVE records from the CVE List of the CVE Program. CVE is a registered trademark of The MITRE Corporation.
          See NOTICE for the terms of every source.
          EOF
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --title "$tag" --notes-file notes.md out/*
      - name: Keep the last 72 releases (three days)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
            --jq 'sort_by(.createdAt) | reverse | .[72:] | .[].tagName' |
          while read -r tag; do
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
