name: Mirror the feed

# TRANSITION ONLY. The feed is built, signed and published by
# openctemio/vulnfeed-bundles. This workflow copies its latest release into
# the releases of this repository, so platforms that still use the old
# default (https://github.com/openctemio/vulnfeed/releases) keep working.
# Nothing is signed here: the files are the ones vulnfeed-bundles signed,
# and they are verified with the pinned root key before they are copied.
#
# Planned removal: once the platform release whose default feed URL is
# vulnfeed-bundles has been out for 30 days (see "Feed and releases" in the
# README), a pull request deletes this workflow and the old releases.

on:
  schedule:
    - cron: "47 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mirror
  cancel-in-progress: false

env:
  SOURCE: openctemio/vulnfeed-bundles

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Latest release of the feed
        id: src
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view --repo "$SOURCE" --json tagName,name > src.json 2>/dev/null; then
            echo "::warning::$SOURCE has no published release yet: nothing to mirror"
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "tag=$(jq -r .tagName src.json)" >> "$GITHUB_OUTPUT"
          echo "title=$(jq -r .name src.json)" >> "$GITHUB_OUTPUT"
      - name: Download it
        if: steps.src.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.src.outputs.tag }}
        run: gh release download "$TAG" --repo "$SOURCE" --dir out
      - name: Build the CLI
        if: steps.src.outputs.found == 'true'
        run: go build -trimpath -o vulnfeed ./cmd/vulnfeed
      - name: Verify as the platform does
        if: steps.src.outputs.found == 'true'
        run: ./vulnfeed verify --dir out --root-key-id "$(cat keys/root-keyid.txt)"
      - name: Publish the copy
        if: steps.src.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.src.outputs.tag }}
          TITLE: ${{ steps.src.outputs.title }}
        run: |
          cat > notes.md <<'NOTES'
          Copy of the release of the same name in openctemio/vulnfeed-bundles, which builds and signs the feed. Kept so that platforms that still read this repository keep working; set VULNFEED_BASE_URL to https://github.com/openctemio/vulnfeed-bundles/releases (the default of newer platforms). This copy will be removed, see the README.

          This product uses data from the NVD API but is not endorsed or certified by the NVD.
          CVE records from the CVE List of the CVE Program. CVE is a registered trademark of The MITRE Corporation.
          See NOTICE for the terms of every source.
          NOTES
          bash .github/scripts/publish-release.sh "$TAG" out
      - name: Keep the last 72 releases (three days)
        if: steps.src.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.src.outputs.tag }}
        run: |
          gh release list --repo "$GITHUB_REPOSITORY" --limit 1000 --json tagName,createdAt \
            --jq 'map(select(.tagName | test("^v1-[0-9]+$"))) | sort_by(.createdAt) | reverse | .[72:] | .[].tagName' |
          while read -r tag; do
            [ "$tag" = "$TAG" ] && continue
            gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          done
